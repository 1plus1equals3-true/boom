name: GundamBoom Stock Monitor

on:
  schedule:
    # 10분마다 실행 (GitHub Actions의 최소 권장 스케줄 주기)
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      notify_all:
        description: '강제 전체 알림 발송 (테스트용)'
        required: false
        type: boolean
        default: false
      custom_keyword:
        description: '임시 테스트 키워드 (비워두면 keywords.json 사용)'
        required: false
        type: string
        default: ''

# 저장소에 상태 파일(data/last_stock.json)을 커밋하기 위한 쓰기 권한
permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 랜덤 지연 부여 (차단 방지)
        if: github.event_name == 'schedule'
        run: |
          # 0초 ~ 300초(5분) 사이 랜덤 대기 (주기 10분 + 0~5분 랜덤 지연)
          DELAY=$((RANDOM % 300))
          echo "차단 방지를 위해 ${DELAY}초 동안 대기 후 검색을 시작합니다..."
          sleep $DELAY

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 건담붐 재고 검색 및 알림 실행
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_FIRST_RUN: ${{ inputs.notify_all && 'true' || 'false' }}
        run: |
          CMD="python main.py"
          if [ "${{ inputs.notify_all }}" = "true" ]; then
            CMD="$CMD --notify-first-run"
          fi
          if [ -n "${{ inputs.custom_keyword }}" ]; then
            CMD="$CMD --keywords '${{ inputs.custom_keyword }}'"
          fi
          echo "실행 명령어: $CMD"
          eval $CMD

      - name: 재고 상태 파일 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # data/last_stock.json 변경 사항이 있을 때만 커밋
          git add data/last_stock.json
          if git diff --staged --quiet; then
            echo "재고 데이터에 변경사항이 없어 커밋을 건너뜁니다."
          else
            git commit -m "chore(stock): update stock state [skip ci]"
            git push
            echo "새로운 재고 상태를 저장소에 업데이트했습니다."
          fi
